<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ad-free weather radar." />
    <title>Radar</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌧️</text></svg>"
    />
  </head>

  <body>
    <div id="map"></div>

    <div id="status" class="status" role="status" hidden></div>

    <div class="panel">
      <p id="nowcast" class="nowcast" data-state="unknown">Checking the forecast…</p>

      <div class="timeline">
        <button id="play" type="button" aria-label="Pause" aria-pressed="true">❚❚</button>
        <input
          id="scrub"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1"
          disabled
          aria-label="Radar time"
        />
        <span id="stamp" class="stamp">loading…</span>
      </div>

      <div class="options">
        <label class="toggle" title="MeteoSwiss 1 km radar, rendered in your browser. Covers Switzerland and its surroundings.">
          <input id="ch" type="checkbox" />
          <span>Swiss radar</span>
        </label>
        <label class="toggle">
          <input id="sat" type="checkbox" />
          <span>Clouds</span>
        </label>
        <button id="locate" type="button" class="ghost">Locate me</button>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
